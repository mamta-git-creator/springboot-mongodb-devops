services:
  app:
    build: .
    container_name: devops-demo-app
    environment:
      MONGODB_URI: mongodb://mongo:27017/devopsdemo
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    container_name: devops-demo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
  mongo:
    image: mongo:8
    container_name: devops-demo-mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongo_data:
    external: true
    name: springboot-mongodb-devops_mongo_data

